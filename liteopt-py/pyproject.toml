[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "liteopt"
version = "0.2.0"
description = "Lightweight gradient descent and nonlinear least-squares solvers implemented in Rust"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24.4"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Taiki Ishigaki", email = "taiki000ishigaki@gmail.com" }
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MathRobotics/liteopt"
Repository = "https://github.com/MathRobotics/liteopt"

[tool.maturin]
bindings = "pyo3"
include = [{ path = "tests/**/*", format = "sdist" }]

[dependency-groups]
dev = [
    "maturin>=1.10.2",
    "pytest>=7.4",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.10.2",
    "pytest>=7.4",
]
